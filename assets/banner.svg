<svg fill="none" viewBox="0 0 1200 360" width="100%" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <filter id="pill-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <style>
      .glow-blob1 {
        animation: floatBlob1 8s ease-in-out infinite alternate;
      }
      .glow-blob2 {
        animation: floatBlob2 10s ease-in-out infinite alternate;
      }
      .pulse-pill {
        animation: pillPulse 4s ease-in-out infinite;
      }
      .data-flow {
        stroke-dasharray: 8 12;
        animation: dash 12s linear infinite;
      }
      @keyframes floatBlob1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(50px, 30px) scale(1.15); }
      }
      @keyframes floatBlob2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-40px, -20px) scale(1.2); }
      }
      @keyframes pillPulse {
        0%, 100% { opacity: 0.85; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-4px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -200; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#1f2937" stroke-width="1.5" />

  <!-- Animated Glowing Background Ambient Orbs (strictly background) -->
  <g filter="url(#blur-glow)">
    <circle class="glow-blob1" cx="250" cy="120" r="130" fill="#38bdf8" opacity="0.35" />
    <circle class="glow-blob2" cx="950" cy="220" r="140" fill="#a855f7" opacity="0.3" />
    <circle cx="600" cy="180" r="100" fill="#6366f1" opacity="0.2" />
  </g>

  <!-- Subtle Animated Architectural Flow Lines in Background -->
  <g opacity="0.25">
    <path class="data-flow" d="M 50 80 Q 300 20 600 80 T 1150 80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="data-flow" d="M 50 280 Q 350 340 700 280 T 1150 290" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Decorative Composable Layer Badges (Floating safely in background margins) -->
  <g class="pulse-pill" filter="url(#pill-shadow)">
    <!-- Top Left Pill -->
    <rect x="70" y="45" width="130" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="135" y="66" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ API-First</text>

    <!-- Top Right Pill -->
    <rect x="1000" y="45" width="130" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.9" />
    <text x="1065" y="66" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🧩 Composable</text>

    <!-- Bottom Left Pill -->
    <rect x="70" y="280" width="140" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1" opacity="0.9" />
    <text x="140" y="301" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🌐 Next.js &amp; Nuxt</text>

    <!-- Bottom Right Pill -->
    <rect x="990" y="280" width="140" height="32" rx="16" fill="#1e293b" stroke="#f472b6" stroke-width="1" opacity="0.9" />
    <text x="1060" y="301" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 GraphQL &amp; REST</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, & Tagline (guaranteed clear & unobstructed) -->
  <g text-anchor="middle">
    <!-- Category Pill Tag -->
    <rect x="490" y="55" width="220" height="28" rx="14" fill="#1e1e38" stroke="#6366f1" stroke-width="1.2" />
    <text x="600" y="74" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="150" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Headless Ecommerce
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">
      API-First Commerce Platforms, Composable Storefronts &amp; Self-Hosted Engines
    </text>

    <!-- Highlights Line -->
    <text x="600" y="235" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      SaaS Enterprise Benchmarks • Open-Source Frameworks • Pricing &amp; Free Tier Insights • Architecture Guides
    </text>
  </g>
</svg>
